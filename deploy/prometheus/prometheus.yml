global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: services
    static_configs:
      - targets:
          - gateway-1:8080
          - gateway-2:8080
          - order-svc:8081
          - kitchen-svc:8081
          - payment-svc:8081
          - courier-svc:8081
          - analytics-svc:8081
          - loadgen:8081
          - chaos-controller:8080
  - job_name: traefik
    static_configs:
      - targets: [traefik:8082]
  - job_name: kafka-exporter
    static_configs:
      - targets: [kafka-exporter:9308]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
