name: chaos-panel

x-app-image: &app-image
  image: chaos-panel:latest
  pull_policy: never

x-app-health: &app-health
  interval: 3s
  timeout: 2s
  retries: 3
  start_period: 5s

services:
  # ---------------------------------------------------------------- data plane
  traefik:
    image: traefik:v3.3
    container_name: traefik
    volumes:
      - ./deploy/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./deploy/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    healthcheck:
      # The Go binary takes a while to spin up per probe on small hosts.
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m

  gateway-1:
    <<: *app-image
    container_name: gateway-1
    build: .
    command: ["gateway"]
    environment:
      SERVICE_ID: gateway-1
      ORDER_SVC_URL: http://order-svc:50051
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/healthz"]
      <<: *app-health
    mem_limit: 64m

  gateway-2:
    <<: *app-image
    container_name: gateway-2
    command: ["gateway"]
    environment:
      SERVICE_ID: gateway-2
      ORDER_SVC_URL: http://order-svc:50051
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/healthz"]
      <<: *app-health
    mem_limit: 64m

  order-svc:
    <<: *app-image
    container_name: order-svc
    command: ["order-svc"]
    environment:
      SERVICE_ID: order-svc
      DATABASE_URL: postgres://chaos:chaos@postgres:5432/chaos
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/healthz"]
      <<: *app-health
    mem_limit: 128m

  kitchen-svc:
    <<: *app-image
    container_name: kitchen-svc
    command: ["kitchen-svc"]
    environment:
      SERVICE_ID: kitchen-svc
      KAFKA_BROKERS: kafka:9092
      KAFKA_PARTITIONS: 12
      # Kitchen throughput ceiling is partitions / avg_cook. Keep it above the
      # steady-state order rate so the backlog stays near zero until a fault,
      # then visibly builds while a component is down.
      COOK_MIN_MS: 3000
      COOK_MAX_MS: 8000
    depends_on:
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/healthz"]
      <<: *app-health
    mem_limit: 128m

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: chaos
      POSTGRES_PASSWORD: chaos
      POSTGRES_DB: chaos
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=50"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chaos -d chaos"]
      interval: 3s
      timeout: 2s
      retries: 10
      # First boot runs initdb, which takes well over the default window.
      start_period: 40s
    mem_limit: 256m

  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *app-health
    mem_limit: 96m

  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9092'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    mem_limit: 1g

  # ------------------------------------------------------------- control plane
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: docker-socket-proxy
    environment:
      # Only the containers section is exposed; that is all start/stop/pause need.
      CONTAINERS: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m

  chaos-controller:
    <<: *app-image
    container_name: chaos-controller
    command: ["chaos-controller"]
    environment:
      SERVICE_ID: chaos-controller
      DOCKER_URL: http://docker-socket-proxy:2375
      PROMETHEUS_URL: http://prometheus:9090
      TOPOLOGY_PATH: /topology.json
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      FAULT_TTL_S: ${FAULT_TTL_S:-60}
      COOLDOWN_S: ${COOLDOWN_S:-15}
      IP_LIMIT_S: ${IP_LIMIT_S:-120}
    volumes:
      - ./topology.json:/topology.json:ro
    depends_on:
      - docker-socket-proxy
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/healthz"]
      <<: *app-health
    mem_limit: 64m

  loadgen:
    <<: *app-image
    container_name: loadgen
    command: ["loadgen"]
    environment:
      SERVICE_ID: loadgen
      BASE_URL: http://traefik:80
      USERS: ${USERS:-10}
    depends_on:
      - traefik
    mem_limit: 64m

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka-exporter
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka: { condition: service_healthy }
    restart: unless-stopped
    mem_limit: 64m

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 384m

  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: ${PUBLIC_URL:-http://localhost:8080}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    mem_limit: 256m

volumes:
  prometheus-data:
