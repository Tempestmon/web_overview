[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/proto",
    "services/gateway",
    "services/order-svc",
    "services/kitchen-svc",
    "services/loadgen",
    "control/chaos-controller",
    "tests/smoke",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
common = { path = "crates/common" }
proto = { path = "crates/proto" }

tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
async-stream = "0.3"
futures = "0.3"
axum = { version = "0.8", features = ["json", "macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors"] }
tonic = { version = "0.14", features = ["transport", "router"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-health = "0.14"
prost = "0.14"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate"] }
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
rdkafka = { version = "0.39", features = ["dynamic-linking", "tokio"] }
bollard = "0.21"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
metrics-util = "0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
rust-embed = { version = "8", features = ["axum"] }
mime_guess = "2"
